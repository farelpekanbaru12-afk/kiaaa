<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Photo Album 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-pink: #ff6b8b;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fbc2eb 100%);
            background-attachment: fixed;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-shape {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.5) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(255, 182, 193, 0.4) 0%, transparent 50%);
        }

        .side-heart {
            position: fixed;
            bottom: -50px;
            font-size: 18px;
            user-select: none;
            z-index: 2;
            pointer-events: none;
            animation: floatUpSide linear infinite;
            opacity: 0.6;
        }

        @keyframes floatUpSide {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .page-container {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hidden {
            opacity: 0;
            transform: scale(0.95) translateY(20px);
            pointer-events: none;
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            display: none !important;
        }

        /* Halaman Utama */
        .home-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            width: 100%;
            max-width: 420px;
            margin: 80px auto;
            padding: 50px 35px;
            border-radius: 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 1);
            animation: fadeInHome 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInHome {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .welcome-photo-frame {
            width: 140px;
            height: 140px;
            margin: 0 auto 25px auto;
            background: #fff;
            padding: 6px;
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(255, 107, 139, 0.25);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 15px 35px rgba(255, 107, 139, 0.25); }
            50% { box-shadow: 0 20px 45px rgba(255, 107, 139, 0.45); }
        }

        .welcome-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 38px;
            color: #4a353b;
            margin: 0 0 8px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 19px;
            color: var(--accent-pink);
            margin: 0 0 20px 0;
            font-weight: 400;
        }

        p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 35px;
            font-weight: 300;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b8b 0%, #ff8e9e 100%);
            color: white;
            padding: 15px 38px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(255, 107, 139, 0.35);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 18px 35px rgba(255, 107, 139, 0.5);
        }

        /* Halaman Galeri */
        #page-gallery {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 45px;
            animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-25px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .gallery-header h1 {
            color: #ffffff;
            font-family: 'Cormorant Garamond', serif;
            font-size: 46px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            margin: 0;
        }

        .gallery-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 45px 35px;
            max-width: 1200px;
            margin: 0 auto 60px auto;
            padding: 20px 15px;
        }

        .polaroid-card {
            background: #ffffff;
            padding: 14px 14px 14px 14px;
            border-radius: 6px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            position: relative;
            opacity: 0;
            transform: translateY(50px) scale(0.9);
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards, floatContinuous 5s ease-in-out infinite;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(var(--rot));
            }
        }

        @keyframes floatContinuous {
            0%, 100% { transform: translateY(0) rotate(var(--rot)); }
            50% { transform: translateY(-8px) rotate(calc(var(--rot) + 1deg)); }
        }

        .polaroid-card::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 18px;
            background: rgba(255, 235, 238, 0.85);
            border: 1px dashed rgba(255, 107, 139, 0.3);
            z-index: 5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .polaroid-card:hover {
            transform: scale(1.12) rotate(0deg) translateY(-15px) !important;
            z-index: 999;
            box-shadow: 0 35px 70px rgba(255, 107, 139, 0.3);
            animation-play-state: paused;
        }

        .polaroid-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 3px;
            display: block;
        }

        .back-container {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.9);
            color: #4a353b;
            border: 1px solid rgba(255, 255, 255, 1);
            backdrop-filter: blur(10px);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="ambient-shape"></div>

    <script>
        const symbols = ['✨', '🤍', '🌸', '💫', '🌷'];
        function createHeart() {
            let heart = document.createElement('div');
            heart.classList.add('side-heart');
            heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            heart.style.left = Math.random() * 95 + 'vw';
            heart.style.animationDuration = (Math.random() * 6 + 6) + 's';
            heart.style.fontSize = (Math.random() * 8 + 16) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 12000);
        }
        setInterval(createHeart, 900);
    </script>

    <!-- HALAMAN UTAMA -->
    <div id="page-home" class="page-container home-card">
        <div class="welcome-photo-frame">
            <img src="foto(1).jpg" alt="Foto Utama" class="welcome-photo">
        </div>
        <h1>Album Foto</h1>
        <h2>Koleksi Potret Spesial</h2>
        <p>Sebuah album digital berisi kumpulan bingkai foto pilihan yang dirangkai estetik khusus untukmu.</p>
        <button class="btn" onclick="openGallery()">Buka Album 🤍</button>
    </div>

    <!-- HALAMAN GALERI -->
    <div id="page-gallery" class="page-container hidden">
        <div class="gallery-header">
            <h1>Photo Collection</h1>
        </div>
        
        <div class="gallery-layout" id="galleryLayout"></div>

        <div class="back-container">
            <button class="btn btn-back" onclick="openHome()">Kembali ↩</button>
        </div>
    </div>

    <script>
        const layout = document.getElementById('galleryLayout');
        const rotations = [-2, 1.5, -1, 2.5, -2.5, 1, -1.5, 2, -1, 1.5, -2, 1, -1.5, 2];

        for (let i = 1; i <= 14; i++) {
            let card = document.createElement('div');
            card.classList.add('polaroid-card');
            
            let rot = rotations[i-1];
            card.style.setProperty('--rot', rot + 'deg');
            card.style.animationDelay = `${(i * 0.06)}s, ${2 + (i * 0.2)}s`;

            card.innerHTML = `
                <img src="foto (${i}).jpg" alt="Foto ${i}">
            `;
            layout.appendChild(card);
        }

        function openGallery() {
            const home = document.getElementById('page-home');
            const gallery = document.getElementById('page-gallery');
            
            home.style.opacity = '0';
            home.style.transform = 'scale(0.95) translateY(-20px)';
            
            setTimeout(() => {
                home.classList.add('hidden');
                gallery.classList.remove('hidden');
                gallery.style.opacity = '1';
                gallery.style.transform = 'scale(1) translateY(0)';
                window.scrollTo(0, 0);
            }, 400);
        }

        function openHome() {
            const home = document.getElementById('page-home');
            const gallery = document.getElementById('page-gallery');
            
            gallery.style.opacity = '0';
            gallery.style.transform = 'scale(0.95) translateY(20px)';
            
            setTimeout(() => {
                gallery.classList.add('hidden');
                home.classList.remove('hidden');
                home.style.opacity = '1';
                home.style.transform = 'scale(1) translateY(0)';
                window.scrollTo(0, 0);
            }, 400);
        }
    </script>
</body>
</html>
