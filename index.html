<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto ✨</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- Hubungkan ke CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-blur blur1"></div>
    <div class="bg-blur blur2"></div>
    <div class="bg-blur blur3"></div>

    <!-- HOME SECTION -->
    <section class="home">
        <div class="home-card">
            <div class="photo-frame">
                <img src="foto1.jpg" alt="Foto Utama">
            </div>

            <div class="tag">Koleksi Foto Pilihan 📸</div>

            <h1>Galeri Foto</h1>
            <p class="subtitle">Kumpulan berbagai potret dan dokumentasi foto pilihan yang tersimpan rapi dalam satu ruang virtual.</p>

            <div id="clock">🕒 Memuat jam...</div>
            <div id="quote">"Setiap foto menyimpan cerita dan keindahannya tersendiri. ✨"</div>

            <button id="openAlbum">Buka Galeri Foto 📂</button>
        </div>
    </section>

    <!-- GALLERY SECTION -->
    <section class="gallery hidden">
        <div class="gallery-top">
            <h2>Daftar Foto ✨</h2>
            <p>Sentuh atau klik foto apa pun untuk memperbesar tampilannya.</p>
        </div>

        <div class="gallery-grid"></div>

        <div style="text-align: center; margin-top: 50px;">
            <button id="backHome">← Kembali ke Beranda</button>
        </div>
    </section>

    <!-- LIGHTBOX -->
    <div class="lightbox">
        <span id="closeLightbox">&times;</span>
        <img src="" alt="Zoomed Photo">
    </div>

    <!-- Hubungkan ke JavaScript -->
    <script src="script.js"></script>
</body>
</html>
